<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Cátia Remelgado — Data Engineer at Critical TechWorks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .name { fill: #e6edf3; font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }
  .role { fill: #9ba8e8; font-size: 18px; font-weight: 600; }
  .meta { fill: #8b949e; font-size: 14px; }
  .code { fill: #6e7681; font-size: 13px; }
</style>
<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9ba8e8"/>
    <stop offset="100%" stop-color="#5865f2"/>
  </linearGradient>
  <radialGradient id="glow" cx="85%" cy="20%" r="60%">
    <stop offset="0%" stop-color="#7289da" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#7289da" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#21262d"/>
  </pattern>
  <clipPath id="card"><rect x="0" y="0" width="900" height="210" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="900" height="210" fill="#0d1117"/>
  <rect x="560" width="340" height="210" fill="url(#dots)"/>
  <rect width="900" height="210" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="210" fill="url(#bar)"/>
</g>
<rect x="0.5" y="0.5" width="899" height="209" rx="10" fill="none" stroke="#30363d"/>

<text x="48" y="58" class="mono code">// hello, world</text>
<text x="48" y="110" class="name">Cátia Remelgado</text>
<text x="48" y="144" class="role">Data Engineer @ Critical TechWorks</text>
<text x="48" y="174" class="meta">Python  ·  AWS  ·  SQL  ·  Java</text>

<g transform="translate(560 82)">
  <text x="0" y="0" class="mono code">class Catia:</text>
  <text x="28" y="24" class="mono code">role = "Data Engineer"</text>
  <text x="28" y="48" class="mono code">stack = ["Python", "AWS", "SQL"]</text>
</g>
</svg>
